base: base.yaml
device: mps            # frozen answer head; policy/value always on cpu
rl:
  hidden: 256
  budget_trajectories: 48000
  eval_every: 50       # updates
  eval_subset: 300     # dev questions
  minibatch: 256
  env_pool: 512
  stub_dim: 128        # synthetic sanity only
data:
  dataset: hybridqa
  processed_dir: data/processed
answer_head:
  path: results/answer_head_row  # R3 (row evidence)
grpo:
  group_size: 8
  questions_per_update: 8
